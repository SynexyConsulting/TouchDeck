# TLS ends at Traefik; this only serves the static files over plain HTTP inside Docker.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml;

    # Server level only: any add_header inside a location would drop these there.
    # Caching is set with `expires`, which doesn't count as add_header.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "frame-ancestors 'none'" always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    location / {
        try_files $uri $uri.html $uri/ =404;
        expires -1;     # Cache-Control: no-cache. Pages change with each deploy.
    }

    location /assets/ {
        expires 1d;     # asset names aren't hashed, so a day rather than forever
    }
}
