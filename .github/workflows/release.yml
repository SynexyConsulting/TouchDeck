# Builds and publishes Touch Deck releases to the public update repo
# (SynexyConsulting/TouchDeckUpdates), where the Windows app finds them.
#
#   git tag app-v1.3.0 && git push origin app-v1.3.0   -> app MSI (+ its bundled RP2040 firmware)
#   git tag fw-v1.7.0  && git push origin fw-v1.7.0    -> RP2040 firmware only
#   Actions > Release > Run workflow                   -> dry run: build + test, keep artifacts
#
# Publishing runs in the GitHub Environment "release". It only releases its secrets to runs for
# app-v*/fw-v* tags (Deployment branches and tags), and a tag ruleset restricts who may create
# those tags. (Required reviewers need GitHub Enterprise for private repos.) Its secrets:
#   TOUCHDECK_UPDATES_TOKEN  fine-grained token, Contents: Read and write on TouchDeckUpdates only
#   TOUCHDECK_FEED_KEY       the feed-signing private key (PEM); its public half is pinned in the app
# Actions are pinned to commit SHAs (Node 24 majors), runner images to exact versions, Python
# packages to exact versions (requirements-ci.txt). Build artifacts are kept 7 days.
name: Release

on:
  push:
    tags: ["app-v*", "fw-v*"]
  workflow_dispatch:

permissions:
  contents: read            # this repo is only read; publishing uses the update-repo token

jobs:
  firmware:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Check the tag matches FW_VERSION
        if: startsWith(github.ref_name, 'fw-v')
        run: |
          want="${GITHUB_REF_NAME#fw-v}"
          have=$(sed -n 's/^#define FW_VERSION *"\(.*\)".*/\1/p' src/version.h)
          [ "$want" = "$have" ] || { echo "tag $want != FW_VERSION $have"; exit 1; }

      # The same Arm GNU Toolchain 14.2.Rel1 as the VS Code Pico extension used for development and
      # hardware testing. Ubuntu's gcc-arm-none-eabi (GCC 13) built a firmware that drew 10-15% slower
      # on average and ~30% slower in the worst watch frame (42 vs 29-33 ms). Checksum from Arm's .sha256asc.
      - name: Toolchain (Arm GNU 14.2.Rel1, pinned)
        run: |
          sudo apt-get update && sudo apt-get install -y cmake ninja-build
          f=arm-gnu-toolchain-14.2.rel1-x86_64-arm-none-eabi.tar.xz
          curl -fsSL -o "$RUNNER_TEMP/$f" "https://developer.arm.com/-/media/Files/downloads/gnu/14.2.rel1/binrel/$f"
          echo "62a63b981fe391a9cbad7ef51b17e49aeaa3e7b0d029b36ca1e9c3b2a9b78823  $RUNNER_TEMP/$f" | sha256sum -c -
          tar -xJf "$RUNNER_TEMP/$f" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/arm-gnu-toolchain-14.2.rel1-x86_64-arm-none-eabi/bin" >> "$GITHUB_PATH"

      - name: Check the compiler
        run: arm-none-eabi-gcc --version | head -1 | grep -F "14.2.1"

      - name: Pico SDK 2.1.1
        run: git clone --depth 1 --branch 2.1.1 --recurse-submodules --shallow-submodules https://github.com/raspberrypi/pico-sdk.git "$RUNNER_TEMP/pico-sdk"

      - name: Build RP2040 firmware
        env:
          PICO_SDK_PATH: ${{ runner.temp }}/pico-sdk
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          ninja -C build
          mkdir -p dist && cp build/watch.uf2 dist/rp2040-169.uf2

      - name: Build RP2350 round firmware (RP2350-Touch-LCD-1.28)
        env:
          PICO_SDK_PATH: ${{ runner.temp }}/pico-sdk
        run: |
          cmake -S . -B build-rp2350 -G Ninja -DCMAKE_BUILD_TYPE=Release -DTD_BOARD=rp2350_128
          ninja -C build-rp2350
          cp build-rp2350/deck128.uf2 dist/rp2350-128.uf2

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Build ESP32-C3 firmware (artifact only; not published until run on hardware)
        run: |
          pip install platformio==6.2.0
          cd esp32c3 && pio run
          cp .pio/build/*/firmware.bin ../dist/esp32c3-128.bin

      - name: Generator and unit tests
        run: |
          pip install -r tools/requirements-ci.txt
          python -m pytest tools/tests -q

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          retention-days: 7          # the real copies live in TouchDeckUpdates
          name: firmware
          path: dist/

  app:
    needs: firmware
    if: startsWith(github.ref_name, 'app-v') || github.event_name == 'workflow_dispatch'
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Check the tag matches the app version
        if: startsWith(github.ref_name, 'app-v')
        shell: pwsh
        run: |
          $want = "$env:GITHUB_REF_NAME".Substring(5)
          $have = ([xml](Get-Content windows-app/Directory.Build.props)).Project.PropertyGroup.Version | Select-Object -First 1
          if ($want -ne $have) { throw "tag $want != app Version $have" }

      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: firmware
          path: dist

      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: "8.0.x"

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Host C tests (MSVC) and unit tests
        run: |
          pip install -r tools/requirements-ci.txt
          python -m pytest tools/tests -q

      - name: Bundle the firmware and build the MSI
        shell: pwsh
        run: |
          Copy-Item dist/rp2040-169.uf2 windows-app/firmware/rp2040-169.uf2 -Force
          Copy-Item dist/rp2350-128.uf2 windows-app/firmware/rp2350-128.uf2 -Force
          $v = (Select-String -Path src/version.h -Pattern '#define FW_VERSION\s+"([^"]+)"').Matches[0].Groups[1].Value
          Set-Content -Path windows-app/firmware/manifest.json -Encoding ascii -Value ("[`n" +
            "  { `"board`": `"rp2040-169`", `"version`": `"$v`", `"file`": `"rp2040-169.uf2`" },`n" +
            "  { `"board`": `"rp2350-128`", `"version`": `"$v`", `"file`": `"rp2350-128.uf2`" }`n]")
          cd windows-app
          ./build.ps1

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          retention-days: 7          # the real copies live in TouchDeckUpdates
          name: msi
          path: windows-app/out/TouchDeck-*.msi

  publish:
    needs: [firmware, app]
    environment: release        # secrets only for app-v*/fw-v* tags; tag creation is restricted
    if: always() && needs.firmware.result == 'success' && (needs.app.result == 'success' || needs.app.result == 'skipped') && github.event_name == 'push'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      # Download each artifact by name into its own folder: without a name, download-artifact v5+
      # puts a lone artifact (a fw-v* run has only "firmware") straight into `path`, not a subfolder.
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: firmware
          path: artifacts/firmware
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        if: startsWith(github.ref_name, 'app-v')
        with:
          name: msi
          path: artifacts/msi
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Publish to TouchDeckUpdates
        env:
          TOUCHDECK_UPDATES_TOKEN: ${{ secrets.TOUCHDECK_UPDATES_TOKEN }}
          TOUCHDECK_FEED_KEY: ${{ secrets.TOUCHDECK_FEED_KEY }}
        run: |
          pip install cryptography==50.0.1
          # Strict tag format before the name is used anywhere (git allows ; $ ( in tag names).
          [[ "$GITHUB_REF_NAME" =~ ^(app|fw)-v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "bad tag"; exit 1; }
          fw=$(sed -n 's/^#define FW_VERSION *"\([0-9.]*\)".*/\1/p' src/version.h)
          args=(--tag "$GITHUB_REF_NAME" --firmware "rp2040-169=$fw=artifacts/firmware/rp2040-169.uf2"
                --firmware "rp2350-128=$fw=artifacts/firmware/rp2350-128.uf2")
          if [[ "$GITHUB_REF_NAME" == app-v* ]]; then
            ver="${GITHUB_REF_NAME#app-v}"
            args+=(--app-windows "artifacts/msi/TouchDeck-$ver.msi" --app-version "$ver" --title "Touch Deck $ver")
          else
            args+=(--title "Touch Deck firmware $fw")
          fi
          python tools/publish_release.py "${args[@]}"
