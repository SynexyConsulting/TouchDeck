; Touch Deck for the ESP32-2424S012C (ESP32-C3, 1.28" round GC9A01, CST816D touch).
; Build:  pio run            Flash:  pio run -t upload   (stop clip_helper.py first)

[env:esp32c3]
platform = espressif32@6.9.0          ; Arduino-ESP32 core 2.0.17
board = esp32-c3-devkitm-1
framework = arduino
board_build.partitions = huge_app.csv ; no OTA, so give the app 3 MB
monitor_speed = 115200
build_flags =
    -DARDUINO_USB_MODE=1              ; native USB-Serial-JTAG
    -DARDUINO_USB_CDC_ON_BOOT=1       ; Serial = the USB port the helper talks to
    -DCONFIG_BT_NIMBLE_MAX_CONNECTIONS=1
    -DCORE_DEBUG_LEVEL=0              ; core log lines would corrupt the helper protocol
lib_deps =
    lovyan03/LovyanGFX@^1.1.16
    h2zero/NimBLE-Arduino@^1.4.3
