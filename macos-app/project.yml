# XcodeGen description of the same project as TouchDeck.xcodeproj (a fallback: if the
# committed project won't open, `brew install xcodegen && xcodegen` here regenerates it).
# Keep it in step with tools/make_xcodeproj.py.
name: TouchDeck
options:
  bundleIdPrefix: com.synexyconsulting
  deploymentTarget:
    macOS: "14.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: "-"
    DEVELOPMENT_TEAM: ""
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  TouchDeckCore:
    type: framework
    platform: macOS
    sources: [TouchDeckCore]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.synexyconsulting.touchdeck.core
        GENERATE_INFOPLIST_FILE: YES
        DEFINES_MODULE: YES
        SKIP_INSTALL: YES
  TouchDeck:
    type: application
    platform: macOS
    sources:
      - path: TouchDeck
        excludes: [Info.plist]
    dependencies:
      - target: TouchDeckCore
        embed: true
    settings:
      base:
        PRODUCT_NAME: Touch Deck
        PRODUCT_MODULE_NAME: TouchDeck
        PRODUCT_BUNDLE_IDENTIFIER: com.synexyconsulting.touchdeck
        INFOPLIST_FILE: TouchDeck/Info.plist
        CODE_SIGN_ENTITLEMENTS: TouchDeck/TouchDeck.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        LD_RUNPATH_SEARCH_PATHS: ["$(inherited)", "@executable_path/../Frameworks"]
      configs:
        Debug:
          ENABLE_HARDENED_RUNTIME: NO
        Release:
          ENABLE_HARDENED_RUNTIME: YES
    postBuildScripts:
      - name: Bundle device renderers and firmware
        script: sh "$SRCROOT/scripts/bundle-native.sh"
        basedOnDependencyAnalysis: false
  TouchDeckTests:
    type: bundle.unit-test
    platform: macOS
    sources: [TouchDeckTests]
    dependencies:
      - target: TouchDeckCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.synexyconsulting.touchdeck.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  TouchDeck:
    build:
      targets:
        TouchDeck: all
    test:
      targets: [TouchDeckTests]
      environmentVariables:
        TOUCHDECK_TDUI_DIR: $(SRCROOT)/../hostui/out
      preActions:
        - script: sh "$SRCROOT/../hostui/build.sh" "$SRCROOT/../hostui/out"
          settingsTarget: TouchDeckTests
